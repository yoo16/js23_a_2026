<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Apparel - Men &amp; Women</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/site.css">
</head>

<body class="min-h-screen bg-stone-50 font-['Inter','Noto_Sans_JP',sans-serif] text-stone-800">

    <!-- ============================= -->
    <!-- ヘッダー -->
    <!-- ============================= -->
    <header class="sticky top-0 z-30 border-b border-stone-200/70 bg-white/80 backdrop-blur">
        <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5">
            <h1 id="shop-title">
                <a href="/" class="flex items-center gap-2.5 text-lg font-semibold tracking-tight text-stone-900">
                    <span class="grid h-8 w-8 place-items-center rounded-full bg-emerald-600 text-sm text-white">S</span>
                    Spring Apparel
                </a>
            </h1>
            <nav class="flex items-center gap-1 text-sm font-medium text-stone-600">
                <a href="/" aria-current="page" class="nav-link rounded-full px-4 py-2 transition hover:bg-stone-100 hover:text-stone-900">Home</a>
                <a href="/about" class="nav-link rounded-full px-4 py-2 transition hover:bg-stone-100 hover:text-stone-900">About</a>
                <a href="/cart.html" class="nav-link flex items-center gap-2 rounded-full px-4 py-2 transition hover:bg-stone-100 hover:text-stone-900">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 7h12l-1 12H7L6 7z M9 7a3 3 0 016 0" />
                    </svg>
                    Cart
                    <span id="cart-count" class="hidden min-w-5 rounded-full bg-emerald-600 px-1.5 text-center text-xs leading-5 text-white">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="mx-auto max-w-6xl px-5">

        <!-- ============================= -->
        <!-- ヒーロー -->
        <!-- ============================= -->
        <section class="relative my-8 overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-50 via-white to-sky-50 px-8 py-16 ring-1 ring-stone-200 sm:px-14 sm:py-24">
            <div class="pointer-events-none absolute -right-16 -top-16 h-72 w-72 rounded-full bg-emerald-200/40 blur-3xl"></div>
            <div class="pointer-events-none absolute -bottom-24 right-32 h-64 w-64 rounded-full bg-sky-200/40 blur-3xl"></div>
            <div class="relative max-w-2xl">
                <p class="mb-4 text-xs font-semibold uppercase tracking-[0.25em] text-emerald-700">Spring Collection</p>
                <h2 class="text-4xl font-semibold leading-tight tracking-tight text-stone-900 sm:text-5xl">
                    Embrace Every Moment<br>with Comfort
                </h2>
                <p class="mt-6 text-base leading-relaxed text-stone-600 sm:text-lg">
                    春のそよ風のように、軽やかに。<br>
                    Spring Apparel は、あなたの日常に寄り添うワードローブをお届けします。
                </p>
                <a href="#product-section"
                    class="mt-8 inline-flex items-center gap-2 rounded-full bg-stone-900 px-6 py-3 text-sm font-medium text-white transition hover:bg-emerald-600">
                    Shop now
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6l6 6-6 6" />
                    </svg>
                </a>
            </div>
        </section>

        <!-- ============================= -->
        <!-- 商品一覧 -->
        <!-- ============================= -->
        <section id="product-section" class="scroll-mt-24 pb-16">
            <div class="flex flex-col gap-4 py-4 lg:flex-row lg:items-center lg:justify-between">
                <div>
                    <h2 class="text-2xl font-semibold tracking-tight text-stone-900">Products</h2>
                    <p id="result-count" class="mt-1 text-sm text-stone-500"></p>
                </div>

                <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
                    <!-- カテゴリフィルター -->
                    <div class="inline-flex w-fit rounded-full border border-stone-200 bg-white p-1">
                        <button id="all-filter-btn" class="filter-btn is-active">All</button>
                        <button id="men-filter-btn" class="filter-btn">Men</button>
                        <button id="women-filter-btn" class="filter-btn">Women</button>
                    </div>

                    <!-- キーワード検索 -->
                    <form action="/search" method="get" class="relative w-full sm:w-64">
                        <svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-400"
                            fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="11" cy="11" r="7" />
                            <path stroke-linecap="round" d="M20 20l-3.5-3.5" />
                        </svg>
                        <input id="keyword" type="text" name="keyword" placeholder="Search products..."
                            class="w-full rounded-full border border-stone-200 bg-white py-2 pl-10 pr-20 text-sm outline-none transition placeholder:text-stone-400 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100">
                        <button type="submit"
                            class="absolute right-1 top-1/2 -translate-y-1/2 rounded-full bg-stone-900 px-3.5 py-1.5 text-xs font-medium text-white transition hover:bg-emerald-600">
                            Search
                        </button>
                    </form>

                    <a href="/api/product/csv_download"
                        class="inline-flex w-fit items-center gap-1.5 rounded-full border border-stone-200 bg-white px-4 py-2 text-xs font-medium text-stone-600 transition hover:border-stone-300 hover:text-stone-900">
                        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14" />
                        </svg>
                        CSV
                    </a>
                </div>
            </div>

            <!-- CSR: クライアントサイドレンダリング（list.js が商品カードを描画） -->
            <div id="product-list" class="mt-4 grid grid-cols-2 gap-4 sm:grid-cols-3 sm:gap-6 lg:grid-cols-4">
                <!-- 読み込み中 -->
                <div class="skeleton aspect-[4/5] rounded-2xl"></div>
                <div class="skeleton aspect-[4/5] rounded-2xl"></div>
                <div class="skeleton aspect-[4/5] rounded-2xl"></div>
                <div class="skeleton aspect-[4/5] rounded-2xl"></div>
            </div>
        </section>
    </main>

    <!-- ============================= -->
    <!-- フッター -->
    <!-- ============================= -->
    <footer class="border-t border-stone-200 bg-white">
        <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-2 px-5 py-8 text-xs text-stone-500 sm:flex-row">
            <p>&copy; 2026 Spring Apparel</p>
            <p>Node.js &amp; Express Sample Shop</p>
        </div>
    </footer>

    <script src="/js/product/list.js"></script>
</body>

</html>
